CONFIG_UFW_ZEPHYR=y
CONFIG_UFW_SLAB_ALLOCATOR=y

# We're currently targetting 3.7.0LTS for the module tests (which also impacts
# the clang-tidy run). Setting this will setup the preprocessor so clang-tidy
# takes the correct turn in uart endpoint interfacing code.
CONFIG_PIPES=y

# Let's check that ufw builds with Zephyr's minimal libc as well. The feature
# set might be diminished, though.
CONFIG_MINIMAL_LIBC=y
